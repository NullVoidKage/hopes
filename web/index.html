    // Fix for debug service errors
    window.addEventListener('error', function(e) {
      if (e.message && e.message.includes('Cannot send Null')) {
        e.preventDefault();
        console.warn('Debug service error suppressed:', e.message);
        return false;
      }
    });
    
    // Suppress debug service console errors
    const originalConsoleError = console.error;
    console.error = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('DebugService: Error serving requestsError')) {
        return; // Suppress debug service errors
      }
      originalConsoleError.apply(console, args);
    };
  </script>
